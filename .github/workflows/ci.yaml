name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    # 40 min covers a full minimina bootstrap (~5–10 min for mina-daemons
    # to sync + first block window) plus the validation + leaderboard
    # poll loops. Tighten only after we have stable historical timings.
    timeout-minutes: 50

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GHCR pulls work without auth for public images, but logging in
      # makes the workflow resilient if any SUT image is later flipped to
      # private and avoids anonymous-pull rate limits.
      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Install minimina
        # MinaFoundation/install-minimina-action@v1 hardcodes the apt
        # codename to "ubuntu" (broken — that component was retired). The
        # o1-labs fork adds a `codename` input; use it.
        uses: o1-labs/install-minimina-action@v1
        with:
          codename: noble
          stream: stable

      - name: ⚙️ Install Python dependencies
        run: pip install -e .

      - name: 🚀 Bring up SUT stack
        run: make up

      - name: 🩺 Snapshot container state pre-test
        run: |
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "--- networks ---"
          docker network ls
          echo "--- node-a-e2e logs (tail) ---"
          docker logs --tail 50 node-a-e2e 2>&1 || true

      # Stream a couple of BPs' logs in the background so the action log
      # has live visibility into mina-daemon bootstrap and block
      # production while pytest blocks on its long polls.
      - name: 📡 Stream mina logs in background
        run: |
          (docker logs -f node-a-e2e 2>&1 | sed 's/^/[node-a] /') &
          (docker logs -f default-seed-e2e 2>&1 | sed 's/^/[seed] /') &
          echo $! > /tmp/log-stream.pid

      - name: 🧪 Run e2e suite
        run: make test

      - name: 📜 Dump compose + minimina logs on failure
        if: failure()
        run: |
          cp .env.example .env  # noop if exists; defensive
          docker compose -f compose/docker-compose.yaml --env-file .env logs --tail 500 || true
          echo "===== minimina ====="
          minimina --mode docker network status -n e2e || true
          for c in default-seed-e2e node-a-e2e node-b-e2e node-c-e2e snark-node-e2e; do
            echo "--- $c ---"
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: 🧹 Tear down
        if: always()
        run: make down
