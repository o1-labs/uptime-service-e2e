name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GHCR pulls work without auth for public images, but logging in
      # makes the workflow resilient if any SUT image is later flipped to
      # private and avoids anonymous-pull rate limits.
      - name: 🔑 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Install Python dependencies
        run: pip install -e .

      - name: 🚀 Bring up SUT stack
        run: make up

      - name: 🧪 Run e2e suite
        run: make test

      - name: 📜 Dump compose logs on failure
        if: failure()
        run: |
          cp .env.example .env  # noop if exists; defensive
          docker compose -f compose/docker-compose.yaml --env-file .env logs --tail 300 || true

      - name: 🧹 Tear down
        if: always()
        run: make down
