# Shared external network with the sibling docker-compose project minimina
# manages (mina seed/BPs/snark). Created by `make net` before either
# compose stack comes up. The mina BPs target the hostname
# `uptime-service-backend-e2e` (baked into minimina's generated compose
# from the topology's Uptime_service_backend node name + network-id), so
# we expose our backend under that alias on this network.
networks:
  default:
  uptime-e2e:
    external: true
    name: uptime-e2e-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delegation_program
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delegation_program"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "${MINIO_HOST_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/${E2E_BUCKET:-test-uptime} &&
      mc anonymous set public local/${E2E_BUCKET:-test-uptime}
      "

  backend:
    image: ghcr.io/o1-labs/uptime-service-backend:${BACKEND_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CONFIG_FILE: /etc/uptime/config.json
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "1"
      AWS_REGION: us-east-1
    volumes:
      - ./config/backend.json:/etc/uptime/config.json:ro
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    command: ["delegation_backend"]
    networks:
      default: {}
      # Alias matches the hostname minimina bakes into BP command lines
      # (uptime-service-backend node name + network-id "e2e"). Without this
      # the BPs would NXDOMAIN and never submit anything.
      uptime-e2e:
        aliases:
          - uptime-service-backend-e2e

  # Inserts the seed bot_logs row required by the validation coordinator.
  # mins-ago=5 puts the previous-batch boundary in the past, so the next
  # batch window covers freshly POSTed submissions.
  validation-init:
    image: ghcr.io/o1-labs/uptime-service-validation:${VALIDATION_TAG:-v2.0.10}
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "${POSTGRES_HOST_PORT:-55432}"
      POSTGRES_DB: delegation_program
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["poetry", "run", "invoke", "init-database", "--mins-ago", "5"]

  validation:
    image: ghcr.io/o1-labs/uptime-service-validation:${VALIDATION_TAG:-v2.0.10}
    # Host network so the worker containers (spawned via DinD with --network host)
    # share addressing with the coordinator. Both reach postgres + minio via
    # localhost:<published-port>.
    network_mode: host
    depends_on:
      validation-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    volumes:
      # DinD: coordinator spawns worker containers via the host docker daemon.
      # The image bundles its own docker CLI as of validation v2.0.9.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TEST_ENV: "1"
      IGNORE_APPLICATION_STATUS: "1"
      SUBMISSION_STORAGE: POSTGRES
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "${POSTGRES_HOST_PORT:-55432}"
      POSTGRES_DB: delegation_program
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      # Locally-built submission-updater wrapper that bakes our minimina
      # genesis into /etc/uptime-e2e/genesis_ledger.json + sets
      # GENESIS_LEDGER_FILE — see compose/worker/Dockerfile. Built by
      # `make worker-image` before `make up`.
      WORKER_IMAGE: ${WORKER_IMAGE:-uptime-e2e-worker}
      WORKER_TAG: ${WORKER_TAG:-dev}
      # Path component for blocks in MinIO: backend writes to
      # s3://${E2E_BUCKET}/${NETWORK_NAME}/blocks/<hash>.dat and the
      # verifier (via submission-updater) downloads from the same path.
      NETWORK_NAME: e2e
      AWS_S3_BUCKET: ${E2E_BUCKET:-test-uptime}
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio12345
      AWS_ENDPOINT_URL_S3: http://localhost:${MINIO_HOST_PORT:-59000}
      AWS_S3_FORCE_PATH_STYLE: "1"
      SURVEY_INTERVAL_MINUTES: "1"
      MINI_BATCH_NUMBER: "1"
      RETRY_COUNT: "1"
      WORKER_TTL_SECONDS_AFTER_FINISHED: "60"
      # Skip the verifier's Pickles SNARK check. Long backstory: real
      # consensus verification needs the daemon's compile-time genesis
      # constants (k, slots_per_epoch, transaction_capacity, …) to match
      # the verifier image's exactly. minimina forces small constants
      # (k=20, 2-min slots) so blocks land in seconds rather than the
      # ~30 min mainnet warmup; the verifier in this image is built
      # against mainnet constants. We tried matching them (see commits on
      # branch history before NO_CHECKS came back) — same image commit,
      # same protocol constants — and Pickles still failed dlog_check on
      # every block. The remaining culprits (SRS path, per-slot proof
      # generation timing on a 4-vCPU GH runner) are below the layer we
      # can drive from compose, so we accept the limitation here and lean
      # on Mina's upstream SNARK tests for cryptographic correctness.
      # Everything else in the pipeline is still real: real BPs, real
      # signed submissions, real schema population, real leaderboard.
      NO_CHECKS: "1"
      # Mounted into worker containers; using the system CA bundle is fine
      # for TEST_ENV (the worker only needs Cassandra TLS, which we don't use).
      SSL_CERTFILE: /etc/ssl/certs/ca-certificates.crt

  leaderboard-api:
    image: ghcr.io/o1-labs/delegation-program-leaderboard-delegation-program-leaderboard-api:${LEADERBOARD_API_TAG:-main-main-49ac4a8}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Historical naming — these are just standard Postgres connection vars.
      SNARK_HOST: postgres
      SNARK_PORT: "5432"
      SNARK_USER: postgres
      SNARK_PASSWORD: postgres
      SNARK_DB: delegation_program
      API_HOST: "0.0.0.0"
      API_PORT: "5000"
      CACHE_TIMEOUT: "300"
      LOGGING_LOCATION: /tmp/app.log
      SWAGGER_HOST: localhost:${LEADERBOARD_API_HOST_PORT:-55000}
      DEBUG: "false"
      LOGGING_LEVEL: INFO
      DB_CONNECTION_TIMEOUT: "10"
      DB_RETRY_ATTEMPTS: "3"
    ports:
      - "${LEADERBOARD_API_HOST_PORT:-55000}:5000"
