[project]
name = "uptime-service-e2e"
version = "0.0.1"
description = "End-to-end tests for the Mina Delegation Program uptime service"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    # Used by scripts/patch_minimina_compose.py to rewrite the
    # docker-compose.yaml minimina emits.
    "PyYAML>=6.0",
]

[tool.setuptools]
# This isn't a library, just a test harness — explicitly tell setuptools
# there are no source packages to install. Without this, the editable
# install tries to auto-discover packages and trips on `compose/` and
# `fixtures/` looking like top-level Python packages.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Hard wall-clock budget per test. SIGALRM-based, so it fires even if the
# system is suspended (unlike time.monotonic, which can be paused on some
# kernels). Slow tests should override with @pytest.mark.timeout(N).
timeout = 60
timeout_method = "signal"
# Apply the timeout to the test body only, not to fixture setup/teardown.
# The session-scoped `first_submission_arrived` fixture can spend up to
# ~30 min waiting for minimina bootstrap; without this flag, that wait
# gets counted against the per-test timeout of whichever test first
# requests the fixture, which kills it mid-bootstrap.
timeout_func_only = true
