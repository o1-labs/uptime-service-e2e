[project]
name = "uptime-service-e2e"
version = "0.0.1"
description = "End-to-end tests for the Mina Delegation Program uptime service"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
