[project]
name = "uptime-service-e2e"
version = "0.0.1"
description = "End-to-end tests for the Mina Delegation Program uptime service"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Hard wall-clock budget per test. SIGALRM-based, so it fires even if the
# system is suspended (unlike time.monotonic, which can be paused on some
# kernels). Slow tests should override with @pytest.mark.timeout(N).
timeout = 60
timeout_method = "signal"
